name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example, v2.0.0)
        type: string
        required: true
      dry_run:
        description: Build and verify the package without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate version tag
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      tag_object: ${{ steps.version.outputs.tag_object }}
    steps:
      - name: Check tag format
        id: tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          node <<'NODE'
          const {appendFileSync} = require('node:fs');
          const tag = process.env.TAG;
          const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(tag);
          if (match?.[0] !== tag || match[4]?.split('.').some(part => /^0[0-9]+$/.test(part))) {
            throw new Error('Expected vMAJOR.MINOR.PATCH with an optional SemVer prerelease');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main and matches manifest versions
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag_object=$(git rev-parse --verify "refs/tags/$TAG")
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [[ "$GITHUB_EVENT_NAME" == push && "$commit" != "$GITHUB_SHA" && "$tag_object" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG changed after the push that started this run"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Tag $TAG must point to a commit in main"
            exit 1
          fi
          node <<'NODE'
          const version = process.env.TAG.slice(1);
          const manifest = require('./package.json');
          const lockfile = require('./package-lock.json');
          if (manifest.version !== version || lockfile.version !== version || lockfile.packages?.['']?.version !== version) {
            throw new Error(`Expected version ${version} in package.json and both root version fields in package-lock.json`);
          }
          NODE
          printf 'commit=%s\ntag_object=%s\n' "$commit" "$tag_object" >> "$GITHUB_OUTPUT"

  test:
    name: Test on Node.js ${{ matrix.node }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  package:
    name: Pack and verify tarball
    needs: [validate, test]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare release files
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          release_dir="$RUNNER_TEMP/release"
          archive="svg-captcha-${TAG#v}.tgz"
          mkdir -p "$release_dir"
          npm pack --ignore-scripts --pack-destination "$release_dir"

          node <<'NODE'
          const {existsSync, readFileSync, writeFileSync} = require('node:fs');
          const {join} = require('node:path');
          if (existsSync('CHANGELOG.md')) {
            const version = process.env.TAG.slice(1);
            const sections = readFileSync('CHANGELOG.md', 'utf8').split(/^##[ \t]+/m).slice(1);
            for (const section of sections) {
              const [heading, ...lines] = section.split(/\r?\n/);
              const label = heading.match(/^(?:\[([^\]]+)\]|(\S+))(?:\s|$)/);
              if ((label?.[1] ?? label?.[2])?.replace(/^v/, '') === version) {
                const notes = lines.join('\n').trim();
                if (notes) writeFileSync(join(process.env.RUNNER_TEMP, 'release', 'notes.md'), `${notes}\n`);
                break;
              }
            }
          }
          NODE

          smoke_dir=$(mktemp -d "$RUNNER_TEMP/svg-captcha-smoke.XXXXXX")
          cd "$smoke_dir"
          npm install --ignore-scripts --no-audit --no-fund "$release_dir/$archive"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const captcha = require('svg-captcha');
          assert.equal(require('svg-captcha/package.json').version, process.env.TAG.slice(1));
          assert.match(captcha('Ab12'), /^<svg\b/);
          const {data, text} = captcha.createStrong();
          assert.ok(Buffer.isBuffer(data));
          assert.equal(data.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
          assert.match(text, /^[23456789ACDEFHJKLMNPRTVWXY]{6}$/);
          NODE

          cd "$release_dir"
          sha256sum "$archive" > SHA256SUMS
      - name: Upload release files
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svg-captcha-${{ needs.validate.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, package]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/release/
      - name: Publish package and checksums
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          status=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -rs --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] |
              if any(.[]; .draft == false) then "published" elif length > 0 then "draft" else "missing" end')
          if [[ "$status" == published ]]; then
            echo "Release $TAG already exists. Skipping publication." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$status" == draft ]]; then
            echo "::error::A draft release for $TAG already exists. Review it before rerunning."
            exit 1
          fi

          archive="svg-captcha-${TAG#v}.tgz"
          sha256sum "$archive" | cmp - SHA256SUMS
          current_tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          if [[ "$current_tag_object" != "$TAG_OBJECT" ]]; then
            echo "::error::Tag $TAG changed after validation"
            exit 1
          fi

          flags=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$COMMIT" --verify-tag)
          if [[ -s notes.md ]]; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # The CLI attaches files to its own draft before publishing it.
          gh release create "$TAG" "$archive" SHA256SUMS "${flags[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
